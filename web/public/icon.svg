<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed: iOS and Android round the corners themselves. Everything that matters sits
       inside the middle 80% (the maskable safe zone). -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#ff3ea5" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ff3ea5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="70%">
      <stop offset="0" stop-color="#36d6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#36d6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffb03a"/>
      <stop offset="0.5" stop-color="#ff3ea5"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <radialGradient id="puck" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffe3f1"/>
      <stop offset="1" stop-color="#ff3ea5"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#0b0a17"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#glow2)"/>
  <!-- the loop's grid -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="3">
    <path d="M128 96v320M192 96v320M256 96v320M320 96v320M384 96v320"/>
    <path d="M96 176h320M96 256h320M96 336h320"/>
  </g>
  <!-- the recorded loop: steps up and down like a played line -->
  <path id="stroke" d="M84 336H170Q186 336 186 320V232Q186 216 202 216H262Q278 216 278 232V280Q278 296 294 296H330Q346 296 346 280V176Q346 160 362 160H428"
        fill="none" stroke="url(#line)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)" opacity="0.9"/>
  <path d="M84 336H170Q186 336 186 320V232Q186 216 202 216H262Q278 216 278 232V280Q278 296 294 296H330Q346 296 346 280V176Q346 160 362 160H428"
        fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the knob's puck riding the line -->
  <circle cx="232" cy="216" r="50" fill="#ff3ea5" opacity="0.35" filter="url(#blur)"/>
  <circle cx="232" cy="216" r="34" fill="url(#puck)"/>
</svg>
