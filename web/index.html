<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixpult</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23121218'/><circle cx='11' cy='16' r='5' fill='%23ff8a3d'/><circle cx='22' cy='11' r='3' fill='%2385e0a3'/><circle cx='22' cy='22' r='3' fill='%23a98bff'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">mixpult</span>
        <span class="tagline">skládej hudbu bez not</span>
      </div>

      <div class="transport">
        <button id="play" class="btn-play" title="Přehrát / zastavit (mezerník)" aria-label="Přehrát">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" /></svg>
          <svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
        </button>
        <button id="rec" class="btn-rec on" title="Nahrávat ťukání do smyčky (R)"><span class="dot"></span>REC</button>
        <button id="metro" class="btn-toggle" title="Metronom (M)">
          <svg viewBox="0 0 24 24"><path d="M9 3h6l4 18H5zM12 15l5-9" /></svg>
        </button>
      </div>

      <div class="fields">
        <label class="field">
          <span>Tempo</span>
          <input id="bpm" type="range" min="60" max="180" step="1" />
          <output id="bpm-out"></output>
        </label>
        <div class="field">
          <span>Délka smyčky</span>
          <div id="length" class="segmented"></div>
        </div>
        <label class="field">
          <span>Nálada</span>
          <select id="mood"></select>
        </label>
        <label class="field">
          <span>Tónina</span>
          <select id="key"></select>
        </label>
        <label class="field">
          <span>Swing</span>
          <input id="swing" type="range" min="0" max="0.6" step="0.01" />
          <output id="swing-out"></output>
        </label>
      </div>

      <div class="actions">
        <button id="undo" class="btn-ghost" title="Zpět (Ctrl/Cmd+Z)">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
        </button>
        <details class="menu" id="menu">
          <summary class="btn-ghost" title="Další">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" /></svg>
          </summary>
          <div class="menu-body">
            <button data-act="demo">Načíst ukázkovou písničku</button>
            <button data-act="new">Nová prázdná písnička</button>
            <hr />
            <button data-act="save">Uložit do souboru…</button>
            <button data-act="open">Otevřít ze souboru…</button>
            <button data-act="record">Stáhnout jako WAV (2× smyčka)</button>
            <hr />
            <label class="menu-field">
              <span>Korekce zpoždění při ťukání</span>
              <input id="latency" type="range" min="-120" max="120" step="5" />
              <output id="latency-out"></output>
            </label>
          </div>
        </details>
        <input id="file" type="file" accept=".json,application/json" hidden />
      </div>
    </header>

    <section id="overview" class="overview" aria-label="Přehled písničky"></section>
    <nav id="tabs" class="tabs" aria-label="Stopy"></nav>
    <main id="panel" class="panel"></main>

    <footer class="footer">
      <span><kbd>mezerník</kbd> přehrát/zastavit</span>
      <span><kbd>1</kbd>–<kbd>5</kbd> přepnout krok</span>
      <span><kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>… hrát na tlačítka</span>
      <span><kbd>R</kbd> nahrávání</span>
      <span><kbd>M</kbd> metronom</span>
      <span class="credits">bicí: tidal-drum-machines · piano: Salamander (CC-BY) · zvuk: Tone.js</span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
