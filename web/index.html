<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Mixpult</title>
    <meta name="description" content="Catchy night techno from your phone. Touch a pad to hear it, hold to record. No notes needed." />
    <!-- Link previews (WhatsApp, Facebook, iMessage...). The worker swaps these for shared songs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mixpult" />
    <meta property="og:title" content="Mixpult: catchy night techno from your phone" />
    <meta property="og:description" content="Touch a pad to hear it, hold to record. No notes needed." />
    <meta property="og:url" content="https://mixpult.brezinovi.sk/" />
    <meta property="og:image" content="https://mixpult.brezinovi.sk/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mixpult: a glowing loop line under the words Catchy night techno from your phone" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo">mixpult</span>
        <h1 id="tab-title" class="tab-title"></h1>
      </div>
      <button id="fullscreen" class="icon-btn" title="Full screen" aria-label="Full screen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
      <button id="share" class="icon-btn" title="Share this song" aria-label="Share this song">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M6 11H5v10h14V11h-1" /></svg>
      </button>
      <details class="menu" id="menu">
        <summary class="icon-btn" aria-label="More">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" /></svg>
        </summary>
        <div class="menu-body">
          <button data-act="undo" id="menu-undo">Undo</button>
          <button data-act="clear" id="menu-clear" class="danger" hidden></button>
          <button data-act="mine" id="menu-mine" hidden>Back to my song</button>
          <button data-act="new">New song</button>
          <button data-act="tour">Show me around</button>
          <hr />
          <button data-act="wav">Download as WAV</button>
          <button data-act="save">Save to file…</button>
          <button data-act="open">Open from file…</button>
          <hr />
          <label class="menu-field">
            <span>Recording delay correction</span>
            <input id="latency" type="range" min="-120" max="120" step="5" />
            <output id="latency-out"></output>
          </label>
          <small id="build" class="menu-info"></small>
        </div>
      </details>
      <button id="play" class="play" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" /></svg>
        <svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
      </button>
      <input id="file" type="file" accept=".json,application/json" hidden />
    </header>

    <section id="song" class="song" aria-label="Loop"></section>
    <main id="panel" class="panel"></main>
    <nav id="tabs" class="tabbar" aria-label="Tracks"></nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
